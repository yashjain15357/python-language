<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flash message</title>
</head>
<body>
    <header>
        <h1>wellcome to my site</h1>
        <nav>
            <a href="/">home</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages() %}

        {% if messages %}
        <ul style="color: greenyellow;">
            {% for msg in messages%}
            <li>{{msg}}</li>
            {%endfor%}

        </ul>
        {%endif%}
        {%endwith%}

        {%block content%}
        {%endblock%}

    </main>



    <footer>
        <p>
            @yashjain 
            since: 2004  
        </p>
    </footer>
    
</body>
</html>
