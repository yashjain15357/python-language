<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash_WTF</title>
</head>

<body>
    <h1>Flask_WTF Registration</h1>

    {% with messages = get_flashed_messages(with_categories=True) %}

    {% if messages %}
   
        {%for category, msg in messages%}
        <p style="color: red;">{{category}}->{{msg}}</p>
        {%endfor%}

    {%endif%}
    {%endwith%}

    {%block content%}
    {%endblock%}


</body>

</html>
