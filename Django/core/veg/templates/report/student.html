{% extends "base.html" %}
{% block content %}
<table class="table table-bordered table-dark">
    <!-- <h2>{{queryset.student_name}}</h2>
    <h2>{{queryset.department.department}}</h2> -->
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Student ID</th>
            <th scope="col">Name</th>
            <th scope="col">Department</th>
            <th scope="col">Email</th>
            <th scope="col">Address</th>
            
        </tr>
    </thead>
    <tbody>
        {% for query in queryset %}
        <tr>
            <th scope="row">{{forloop.counter}}</th>
            <th><a href="{{query.student_id}}">{{query.student_id}}</a></th>
            <th>{{query.student_name}}</th>
            <td>{{query.department}}</td>
            <td>{{query.student_email}}</td>
            <td>{{query.student_address}}</td>
            
        </tr>
        {% endfor %}
        
    </tbody>
</table>
{% endblock %}
